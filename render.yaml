services:
  - type: web
    name: x-vibebot
    runtime: docker
    plan: starter
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: HEADLESS
        value: "true"
      - key: BROWSER_PROFILE_DIR
        value: /data/browser_profiles/x_browser_profile
      - key: DATABASE_URL
        value: sqlite:////data/vibebot.db
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PROXY_SERVER
        sync: false
      - key: PROXY_USERNAME
        sync: false
      - key: PROXY_PASSWORD
        sync: false
      - key: PORT
        value: "8000"
    disk:
      name: vibebot-data
      mountPath: /data
      sizeGB: 1
